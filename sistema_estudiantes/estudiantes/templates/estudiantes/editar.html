<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar estudiante</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 700px;
            margin: auto;
        }

        .seccion {
            background-color: white;
            padding: 30px;
            margin-top: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        form p {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .volver {
            display: inline-block;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }

        .volver:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Sistema de Gestión de Estudiantes</h1>

    <div class="seccion">

        <h2>Editar estudiante</h2>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Guardar cambios
            </button>
        </form>

        <a class="volver" href="{% url 'inicio' %}">
            ← Volver al inicio
        </a>

    </div>

</div>

</body>
</html>
