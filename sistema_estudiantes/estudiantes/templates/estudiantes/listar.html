<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de estudiantes</title>
</head>
<body>

    <h1>Lista de estudiantes</h1>

    {% if estudiantes %}
        <ul>
            {% for estudiante in estudiantes %}
                <li>
                   {{ estudiante.nombre }}
                   {{ estudiante.apellido }}
                    - {{ estudiante.carrera }}
                   - Semestre {{ estudiante.semestre }}

                   <a href="{% url 'editar_estudiante' estudiante.id %}">
                        Editar
                   </a>
                    <a href="{% url 'eliminar_estudiante' estudiante.id %}">
                        Eliminar
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No hay estudiantes registrados.</p>
    {% endif %}

</body>
</html>
